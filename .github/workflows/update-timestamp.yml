name: Update last-update timestamp

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/last_update.json'

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write current timestamp
        run: |
          mkdir -p data
          echo "{\"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > data/last_update.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_update.json
          git diff --quiet --cached || git commit -m "chore: update last-update timestamp [skip ci]"
          git push
